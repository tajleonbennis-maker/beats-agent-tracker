services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.4
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      # Runtime 发射的事件目录（宿主机 runtime/agent.py --events-dir events）
      - ../events:/events:ro
      - ./filebeat.es.yml:/usr/share/filebeat/filebeat.yml:ro
    command: filebeat -e --strict.perms=false
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_USER=elastic
      - ES_PASSWORD=changeme

volumes:
  esdata:
